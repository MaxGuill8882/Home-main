<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="config/apps/icons/calendar.svg">
<title>Application</title>
<style>
:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: #fff; background: linear-gradient(135deg, #172033, #304b63); }
main { max-width: 900px; margin: auto; padding: 48px 28px; }
.eyebrow { margin: 0 0 12px; color: #a9d8ff; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(32px, 7vw, 64px); }
p { color: rgba(255,255,255,.72); line-height: 1.6; }
.panel { margin-top: 32px; padding: 24px; border: 1px solid rgba(255,255,255,.2); border-radius: 20px; background: rgba(255,255,255,.1); }
button { padding: 11px 16px; border: 0; border-radius: 10px; color: #102033; background: #b9e1ff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Home app</p>
  <h1 id="app-name">Application</h1>
  <div class="panel">
    <p>Cette page locale est compatible avec l'iframe et sert de contenu intégré pour cette application.</p>
    <button type="button" onclick="document.querySelector('p').textContent = 'Application prête.'">Ouvrir</button>
  </div>
</main>
<script>
const names = {
  safari: 'Safari', mail: 'Mail', photos: 'Photos', music: 'Musique', calendar: 'Calendrier',
  camera: 'Appareil photo', notes: 'Notes', maps: 'Plans', weather: 'Météo', files: 'Fichiers',
  facetime: 'FaceTime', reminders: 'Rappels', google: 'Google', youtube: 'YouTube',
  appstore: 'App Store', settings: 'Réglages', tasks: 'Home Task Service'
};
const app = new URLSearchParams(location.search).get('app');
document.title = names[app] || 'Application';
document.querySelector('#app-name').textContent = names[app] || 'Application';
</script>
</body>
</html>
